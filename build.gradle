plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// ModDevGradle 默认会注册 Mojang/NeoForged 官方源（maven.neoforged.net 在国内经常连不上），
// 这里先 clear 掉再按国内可用的镜像顺序重新声明。
repositories.clear()
repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://libraries.minecraft.net/" }
    maven {
        name = "neoforgedReleases"
        url = uri("https://neoforged.forgecdn.net/releases")
    }
    maven {
        name = "neoforgedMojangMeta"
        url = uri("https://neoforged.forgecdn.net/mojang-meta")
    }
    maven { url = "https://maven.aliyun.com/repository/public" }
    maven { url = "https://maven.createmod.net" }       // Create / Ponder / Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com" }        // JEI
    maven { url = "https://maven.ryanhcode.dev/releases" } // Sable / Simulated / Aeronautics / Offroad
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // 测试钩子：`./gradlew.bat runClient -PquickPlaySingleplayer=世界名` 直接载入单机存档
            if (project.hasProperty('quickPlaySingleplayer')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.quickPlaySingleplayer
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // 软依赖（Sable / Aeronautics / JEI）只参与本工程编译与运行，不传递给任何下游
    localImplementation
    compileClasspath.extendsFrom localImplementation
    runtimeClasspath.extendsFrom localImplementation
}

dependencies {
    // ---- Create 6.0 (1.21.1) 核心 ----
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // ---- Create: Aeronautics 套件（软依赖 / 编译期可见）----
    // sable 的 pom 会带出 sable-companion（SableCompanion / SubLevelAccess），因此不用单独声明
    localImplementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}")
    localImplementation("dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${create_aeronautics_version}") { transitive = false }
    localImplementation("dev.eriksonn.aeronautics:aeronautics-neoforge-${minecraft_version}:${create_aeronautics_version}") { transitive = false }
    localImplementation("dev.ryanhcode.offroad:offroad-neoforge-${minecraft_version}:${create_aeronautics_version}") { transitive = false }

    // ---- JEI（软依赖：只在 compat.jei 包里引用，缺失时相关类不会被加载）----
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

// 把根目录 GPL-3.0 许可证全文一并打进 jar（GPL 要求分发时附带许可证）
tasks.named('processResources') {
    from rootProject.file('LICENSE')
}

// neoforge.mods.toml 的 ${} 占位符展开
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // 模板里有中文注释：读写必须显式 UTF-8，否则中文 Windows 上会生成非法 UTF-8 导致 FML 解析失败
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
