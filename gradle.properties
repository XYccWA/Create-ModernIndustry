# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# moddev 2.x 与 configuration-cache 仍有一些边角问题，这里保持关闭
org.gradle.configuration-cache=false
# JAVA_HOME 是 JDK17 而本工程需要 Java 21 工具链：直接告诉 Gradle 21 装在哪，
# 免得 foojay 再去联网下载一个 JDK。
org.gradle.java.installations.paths=D:/java21

# ---------------------------------------------------------------------------
# 基础工具链（Minecraft 1.21.1 / NeoForge 21.1.x）
# ---------------------------------------------------------------------------
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.234
loader_version_range=[4,)

# ---------------------------------------------------------------------------
# Create 生态版本（与 SpaceSimulation / CreateFutureWarfare 保持同一套，方便互测）
# ---------------------------------------------------------------------------
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# ---------------------------------------------------------------------------
# Create: Aeronautics 套件 = Sable(物理) + Simulated(传动) + Aeronautics(内容) + Offroad(轮胎)
# 均为软依赖：编译期可见，运行期缺失也不影响本模组加载。
# ---------------------------------------------------------------------------
sable_version=2.0.5
create_aeronautics_version=1.3.1

# ---------------------------------------------------------------------------
# JEI（软依赖）
# ---------------------------------------------------------------------------
jei_version=19.21.0.247

# ---------------------------------------------------------------------------
# 本模组
# ---------------------------------------------------------------------------
mod_id=create_modern_industry
mod_name=Create: Modern Industry
mod_license=GPL-3.0
mod_version=0.1.0
mod_group_id=org.xyccwa.create_modern_industry
